[package]
name = "zfound"
version = "0.1.0"
description = "ZFound by Zeeno Soft - Minimal Vision Intelligence"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "zfound_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6", features = [] }
walkdir = "2.5"
rayon = "1.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp"] }
base64 = "0.22"
rfd = "0.15"
